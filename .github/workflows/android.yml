name: Android and API checks
on:
  push:
    paths: &build-paths
      - 'app/**'
      - 'backend/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *build-paths
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npx wrangler deploy --dry-run
        working-directory: backend
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-configuration-cache
      - name: Prepare installable preview APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LTMFactCheck-3.2.0-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/LTMFactCheck-3.2.0-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/LTMFactCheck-3.2.0-preview.apk > dist/badging.txt
          sed -n '1p' dist/badging.txt
          sha256sum dist/LTMFactCheck-3.2.0-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LTMFactCheck-3.2.0-preview-apk
          compression-level: 0
          path: dist/LTMFactCheck-3.2.0-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/
